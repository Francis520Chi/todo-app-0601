<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="todo-panel" aria-labelledby="app-title">
      <p class="eyebrow">0601 練習專案</p>
      <h1 id="app-title">我的待辦清單</h1>
      <button id="theme-toggle" class="theme-toggle" type="button">開啟深色模式</button>

      <form id="todo-form" class="todo-form">
        <label for="todo-input">新增任務</label>
        <div class="input-row">
          <input
            id="todo-input"
            type="text"
            placeholder="例如：練習使用 Codex"
            autocomplete="off"
            required
          >
          <button type="submit">新增</button>
        </div>
        <label for="category-select">任務分類</label>
        <select id="category-select" class="category-select">
          <option value="工作">工作</option>
          <option value="生活">生活</option>
          <option value="學習">學習</option>
          <option value="其他">其他</option>
        </select>
      </form>

      <div id="todo-stats" class="todo-stats" aria-live="polite">
        <span>全部：0</span>
        <span>已完成：0</span>
        <span>未完成：0</span>
      </div>

      <label class="search-label" for="search-input">搜尋任務</label>
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="輸入關鍵字..."
        autocomplete="off"
      >

      <div class="filter-controls" aria-label="篩選任務">
        <button class="filter-button active" type="button" data-filter="all">全部</button>
        <button class="filter-button" type="button" data-filter="active">未完成</button>
        <button class="filter-button" type="button" data-filter="completed">已完成</button>
      </div>

      <label class="category-filter-label" for="category-filter">分類篩選</label>
      <select id="category-filter" class="category-filter">
        <option value="全部分類">全部分類</option>
        <option value="工作">工作</option>
        <option value="生活">生活</option>
        <option value="學習">學習</option>
        <option value="其他">其他</option>
      </select>

      <div class="data-controls" aria-label="備份任務資料">
        <button id="export-button" class="data-button" type="button">匯出資料</button>
        <button id="import-button" class="data-button" type="button">匯入資料</button>
        <input id="import-file" class="file-input" type="file" accept="application/json">
      </div>

      <button id="clear-button" class="clear-button hidden" type="button">清除全部</button>

      <ul id="todo-list" class="todo-list" aria-label="待辦任務"></ul>

      <p id="empty-message" class="empty-message">目前沒有任務，新增一個開始吧。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
