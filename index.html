<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="todo-panel" aria-labelledby="app-title">
      <p class="eyebrow">0601 練習專案</p>
      <h1 id="app-title">我的待辦清單</h1>

      <form id="todo-form" class="todo-form">
        <label for="todo-input">新增任務</label>
        <div class="input-row">
          <input
            id="todo-input"
            type="text"
            placeholder="例如：練習使用 Codex"
            autocomplete="off"
            required
          >
          <button type="submit">新增</button>
        </div>
      </form>

      <button id="clear-button" class="clear-button hidden" type="button">清除全部</button>

      <ul id="todo-list" class="todo-list" aria-label="待辦任務"></ul>

      <p id="empty-message" class="empty-message">目前沒有任務，新增一個開始吧。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
